[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisha-chat-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0",
  "Pillow>=11,<13",
  "playwright==1.56.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisha_chat = ["fonts/*.ttf", "fonts/*.txt", "fonts/*.md"]
