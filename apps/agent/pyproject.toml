[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisha-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.129.2",
  "uvicorn[standard]==0.41.0",
  "httpx==0.28.1",
  "openai==2.21.0",
  "python-dotenv==1.2.1",
  "apscheduler[sqlalchemy]==4.0.0a6",
  "google-genai==1.66.0",
  "dateparser==1.3.0",
  "sqlalchemy[asyncio]==2.0.48",
  "asyncpg==0.31.0",
  "pymupdf==1.28.2",
  "pymupdf4llm==1.28.2",
  "python-docx==1.2.0",
  "yt-dlp==2026.3.3",
  "playwright==1.56.0",
  "Pillow==12.3.0",
  "aisha-chat-analysis==0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisha = ["resources/*.md"]
