[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisha-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "openai",
  "python-dotenv",
  "apscheduler[sqlalchemy]==4.0.0a6",
  "google-genai>=1.0",
  "dateparser>=1.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pymupdf>=1.26,<2",
  "pymupdf4llm>=0.0.17,<2",
  "python-docx>=1.1",
  "yt-dlp>=2026.3.3",
  "playwright==1.56.0",
  "Pillow>=11,<13",
  "aisha-chat-analysis==0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisha = ["resources/*.md"]
