[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisha-playground"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aisha-chat-analysis==0.1.0",
  "python-dotenv==1.2.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aisha-playground = "aisha_playground.cli:main"
